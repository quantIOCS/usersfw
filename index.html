<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Generador de usuarios locales FortiGate</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-color: #f6f8fa;
            --container-bg: #ffffff;
            --text-color: #24292f;
            --border-color: #d0d7de;
            --btn-primary: #2ea44f;
            --btn-primary-hover: #2c974b;
            --btn-secondary: #0969da;
            --btn-secondary-hover: #035fc7;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 30px;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.05);
        }
        h1 {
            font-size: 24px;
            margin-top: 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-family: monospace;
            font-size: 14px;
            box-sizing: border-box;
            resize: vertical;
        }
        .btn {
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        .btn-primary { background-color: var(--btn-primary); }
        .btn-primary:hover { background-color: var(--btn-primary-hover); }
        .btn-secondary { background-color: var(--btn-secondary); }
        .btn-secondary:hover { background-color: var(--btn-secondary-hover); }
        .output-section {
            margin-top: 30px;
            background-color: #f6f8fa;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            display: none; /* Se oculta hasta que haya datos */
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔐 Generador de usuarios locales FortiGate</h1>
    <p>Ingresa una lista de nombres de usuario (uno por línea). El sistema generará contraseñas seguras y el script CLI para FortiOS.</p>

    <div class="form-group">
        <label for="input-usuarios">Lista de Usuarios:</label>
        <textarea id="input-usuarios" rows="6" placeholder="usuario1&#10;usuario2&#10;admin_red..."></textarea>
    </div>

    <button class="btn btn-secondary" onclick="procesarUsuarios()">⚙️ Generar Credenciales y CLI</button>

    <div class="output-section" id="seccion-resultados">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <label style="margin: 0;">Script CLI de FortiGate:</label>
            <div>
                <button class="btn btn-primary" id="btn-copiar" onclick="copiarComandos()">📋 Copiar Comandos</button>
                <button class="btn btn-secondary" onclick="exportarExcel()">📊 Descargar Excel</button>
            </div>
        </div>
        
        <textarea id="comandos-cli" rows="12" readonly></textarea>
    </div>
</div>

<script>
    // Variable global para guardar los datos y exportarlos a Excel
    let baseDatosUsuarios = [];

    // Función para generar contraseñas criptográficamente seguras
    function generarPassword(longitud = 12) {
        const caracteres = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^*_+";
        let password = "";
        const arrayAleatorio = new Uint32Array(longitud);
        window.crypto.getRandomValues(arrayAleatorio);
        for (let i = 0; i < longitud; i++) {
            password += caracteres[arrayAleatorio[i] % caracteres.length];
        }
        return password;
    }

    // Función principal
    function procesarUsuarios() {
        const input = document.getElementById("input-usuarios").value.trim();
        if (!input) {
            alert("Por favor, ingresa al menos un usuario.");
            return;
        }

        const lineas = input.split('\n');
        baseDatosUsuarios = []; // Limpiamos la base de datos anterior
        
        let scriptCLI = "config user local\n";

        lineas.forEach(linea => {
            const usuario = linea.trim();
            if (usuario) {
                const password = generarPassword();
                
                // Guardamos para el Excel
                baseDatosUsuarios.push({ Usuario: usuario, Contraseña: password });

                // Formato FortiGate
                scriptCLI += `    edit "${usuario}"\n`;
                scriptCLI += `        set type password\n`;
                scriptCLI += `        set passwd "${password}"\n`;
                scriptCLI += `    next\n`;
            }
        });

        scriptCLI += "end\n";

        // Mostrar resultados
        document.getElementById("comandos-cli").value = scriptCLI;
        document.getElementById("seccion-resultados").style.display = "block";
    }

    // Función para el botón de copiado
    function copiarComandos() {
        const elemento = document.getElementById("comandos-cli");
        const textoParaCopiar = elemento.value;

        navigator.clipboard.writeText(textoParaCopiar).then(() => {
            const boton = document.getElementById("btn-copiar");
            const textoOriginal = "📋 Copiar Comandos";
            boton.innerHTML = "✅ ¡Copiado!";
            boton.style.backgroundColor = "#238636"; // Verde más oscuro
            
            setTimeout(() => {
                boton.innerHTML = textoOriginal;
                boton.style.backgroundColor = "var(--btn-primary)";
            }, 2000);
        }).catch(err => {
            console.error('Error al copiar: ', err);
            alert("Hubo un error al intentar copiar los comandos.");
        });
    }

    // Función para exportar a Excel (Client-Side)
    function exportarExcel() {
        if (baseDatosUsuarios.length === 0) return;
        
        const hoja = XLSX.utils.json_to_sheet(baseDatosUsuarios);
        const libro = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(libro, hoja, "Credenciales");
        
        // Descarga el archivo
        XLSX.writeFile(libro, "Usuarios_FortiGate.xlsx");
    }
</script>

</body>
</html>
